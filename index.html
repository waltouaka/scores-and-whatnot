<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Scores and Whatnot</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0f;--paper:#17171a;--paper2:#202024;--ink:#ededf0;--muted:#9b9ba5;--line:#2c2c32;--bar:#000;--goal:#e4262c;--live:#ff3b30;
--d:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--b:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
html{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--b)}
button{font-family:inherit}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--goal);outline-offset:2px}
a{color:var(--ink)}
.top{background:var(--bar);border-bottom:1px solid var(--line)}
.bar{max-width:1000px;margin:0 auto;padding:.9rem 1.25rem 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:.5rem 2rem}
.bar h1{font:800 2rem/1 var(--d);margin:0 0 .6rem;letter-spacing:.01em}
#tabs{display:flex;flex-wrap:wrap;gap:.25rem}
#tabs button{font:700 1.25rem var(--d);letter-spacing:.04em;color:var(--muted);background:none;border:0;border-bottom:4px solid transparent;padding:.4rem 1rem .5rem;cursor:pointer}
#tabs button[aria-pressed="true"]{color:#fff;border-color:var(--goal)}
.wrap{max-width:1000px;margin:0 auto;padding:1.5rem 1.25rem 4rem}
h2{font:800 1.7rem/1 var(--d);margin:1.5rem 0 .7rem}
h3{font:800 1.3rem/1 var(--d);margin:1.4rem 0 .5rem}
.note{color:var(--muted)}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:1rem;margin-bottom:1rem}
.hd h2{margin:0}
select{font:600 1rem var(--b);padding:.45rem .7rem;background:var(--paper2);color:var(--ink);border:1px solid var(--line);border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.75rem}
.tile{display:block;width:100%;text-align:left;color:inherit;background:var(--paper);border:1px solid var(--line);padding:.6rem .8rem;cursor:pointer}
.tile:hover{background:var(--paper2)}
.tile.live{border-left:4px solid var(--live)}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;margin-bottom:.3rem}
.dot{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:var(--live);margin-right:.35rem;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.sd{display:flex;align-items:center;gap:.6rem;font:700 1.4rem/1.5 var(--d)}
.sd b{flex:1;font-weight:700}.sd.l{opacity:.55}
.rec{font:500 .85rem var(--b);color:var(--muted);margin-left:.45rem}
.logo{width:1.8rem;height:1.8rem;object-fit:contain;flex:none}
.game{background:var(--paper);border:1px solid var(--line);margin-bottom:1.25rem}
.sc{display:grid;grid-template-columns:1fr auto;align-items:center;gap:.1rem 1rem;padding:1rem 1.25rem .4rem}
.tm{display:flex;align-items:center;gap:.7rem;font:700 1.7rem/1.1 var(--d)}.tm .logo{width:2.4rem;height:2.4rem}
.num{font:800 2.6rem/1 var(--d);text-align:right}.lose{opacity:.55}
.st{padding:0 1.25rem;color:var(--muted);font-size:.85rem;display:flex;flex-wrap:wrap;gap:.2rem 1rem;align-items:center}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:0}
.strip{position:relative;height:24px;margin:.6rem 1.25rem 1rem;border-bottom:2px solid var(--line)}
.strip i{position:absolute;bottom:-7px;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);transform:translateX(-50%);background:var(--ink)}
.strip i.fg{background:var(--paper);width:10px;height:10px}
.plays{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.plays li{border-bottom:1px solid var(--line)}.plays li:last-child{border:0}
.pl{display:grid;grid-template-columns:3.8rem 40px 1fr auto;gap:.75rem;align-items:center;padding:.65rem 1.25rem}
.clock{font:700 1.15rem var(--d);color:var(--muted)}.who small{display:block;color:var(--muted)}
.tag{font:700 .8rem var(--d);border:1px solid var(--line);padding:0 .35rem;margin-left:.4rem;color:var(--muted)}
.play{border:2px solid var(--ink);background:none;color:var(--ink);font:700 1rem var(--d);letter-spacing:.04em;padding:.25rem .85rem;border-radius:999px;cursor:pointer}
.play:hover{background:var(--ink);color:var(--bg)}
.clip{padding:0 1.25rem 1rem}.clip video,.clip iframe{width:100%;aspect-ratio:16/9;border:0;background:#000;display:block;margin-bottom:.4rem}
.noclip{padding:1.5rem;background:#000;color:var(--muted);margin-bottom:.4rem}
.clip a{font-size:.9rem}.clip .hint{font-size:.8rem;color:var(--muted);margin:0 0 .3rem}
.tot{display:flex;gap:2.2rem;border-bottom:2px solid var(--ink);padding-bottom:.9rem;margin-bottom:1.2rem}
.tot b{display:block;font:800 2.6rem/1 var(--d)}.tot span{color:var(--muted);font-size:.9rem}
dialog{border:1px solid var(--line);padding:0;width:min(780px,96vw);max-height:92vh;overflow:auto;background:var(--paper);color:var(--ink);box-shadow:0 24px 70px rgba(0,0,0,.7)}
dialog::backdrop{background:rgba(0,0,0,.8)}
.dtop{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1.25rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:1}
.dtop span{color:var(--muted);font-size:.85rem}
.close{border:2px solid var(--ink);background:none;color:var(--ink);font:700 1rem var(--d);padding:.2rem .8rem;border-radius:999px;cursor:pointer}
.gh{padding:1rem 1.25rem .5rem}
.gstate{color:var(--muted);margin-top:.3rem;font-size:.95rem}
.gstate.live{color:#fff}
.ls{width:100%;border-collapse:collapse;margin:.5rem 0 1rem;font:700 1.15rem var(--d)}
.ls th,.ls td{padding:.3rem 1.25rem;text-align:center;border-bottom:1px solid var(--line)}
.ls th{color:var(--muted);font-weight:700}.ls th:first-child,.ls td:first-child{text-align:left}
.ls td:last-child,.ls th:last-child{font-weight:800}
.stats th,.stats td{text-align:center!important;font-weight:700!important}
.stats td:nth-child(2){color:var(--muted);font:500 .95rem var(--b)}
.dsub{font:800 1.3rem var(--d);padding:.4rem 1.25rem}
.vb{display:flex;flex-wrap:wrap;gap:.5rem;padding:0 1.25rem .8rem}
.pcard{display:flex;align-items:center;gap:.8rem;background:#000;border:1px solid var(--line);padding:.8rem 1rem;margin-bottom:.5rem;flex-wrap:wrap}
.hs{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:top;background:var(--paper2);border:2px solid var(--line);flex:none;display:inline-flex;align-items:center;justify-content:center;font:800 1.3rem var(--d);color:var(--muted)}
.hs+.hs{margin-left:-1.4rem}
.pcard .tx{flex:1;min-width:10rem}.pcard .tx b{font:800 1.4rem/1.1 var(--d);display:block}.pcard .tx small{color:var(--muted)}
.big{display:inline-block;background:var(--goal);color:#fff;font:700 1.1rem var(--d);letter-spacing:.04em;padding:.5rem 1.1rem;border-radius:999px;text-decoration:none;border:0;cursor:pointer}
.big:hover{filter:brightness(1.15)}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);font:600 .85rem var(--b);padding:.3rem .8rem;border-radius:999px;cursor:pointer;margin-left:.4rem}
:root{--glow:rgba(228,38,44,.16)}
body{background:radial-gradient(1100px 480px at 8% -8%,var(--glow),transparent 60%),radial-gradient(900px 480px at 100% 0,rgba(70,120,255,.10),transparent 55%),var(--bg);background-attachment:fixed}
.top{position:sticky;top:0;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.55);background:rgba(0,0,0,.92);backdrop-filter:blur(6px)}
.bar h1{display:flex;align-items:center;gap:.4rem;font-weight:800;letter-spacing:.06em}
.bar h1 em{font-style:normal;color:var(--goal)}
.mk{display:inline-grid;place-items:center;width:1.5rem;height:1.5rem;background:var(--goal);color:#fff;font-size:.8rem;transform:skew(-10deg);margin-right:.2rem}
.lp::before{content:"";display:inline-block;width:.5rem;height:.5rem;border-radius:50%;background:#fff;margin-right:.4rem}
.lp{font:700 .85rem var(--d);letter-spacing:.08em;color:#fff;background:var(--live);border-radius:999px;padding:.1rem .7rem;margin:0 0 .6rem;animation:p 1.6s infinite}
.game{border-left:4px solid color-mix(in srgb,var(--tc,#e4262c) 65%,#fff 35%);background:linear-gradient(100deg,color-mix(in srgb,var(--tc,#e4262c) 20%,var(--paper)),var(--paper) 48%);animation:up .45s both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tile{transition:transform .15s,border-color .15s}.tile:hover{transform:translateY(-2px);border-color:var(--ink)}
.tile.flash{animation:flash 1.4s ease-out 4;background:#2a1214}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(255,59,48,.85)}100%{box-shadow:0 0 0 16px rgba(255,59,48,0)}}
.num{font-size:3rem}
.tot b{background:linear-gradient(180deg,#fff,#8e8e99);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag.tdt{color:#7cffb2;border-color:#1f6b45}.tag.fgt{color:#ffd166;border-color:#7a5c14}
.clip iframe.tw{aspect-ratio:auto;height:640px;max-width:560px;background:transparent}
.hs{overflow:hidden;position:relative}.hs img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.hs.sm{width:40px;height:40px;font-size:.85rem}.hs.lg{width:76px;height:76px;font-size:1.4rem}
.hs.lg+.hs.lg{margin-left:-1.6rem}
.finds-row{padding:.2rem 0 .3rem}.finds{color:var(--muted);font-size:.9rem}.finds a{margin-left:.7rem;font-weight:600}
.after{display:block;color:var(--ink);font:700 .95rem var(--d);margin-top:.25rem;letter-spacing:.03em}
.foot{max-width:1000px;margin:0 auto;padding:0 1.25rem 2.5rem;color:var(--muted);font-size:.78rem}
@media (prefers-reduced-motion:reduce){.game,.tile.flash,.lp{animation:none}.tile{transition:none}}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-bottom:1rem}
.tools input{font:500 1rem var(--b);padding:.45rem .7rem;background:var(--paper2);color:var(--ink);border:1px solid var(--line);border-radius:6px;min-width:11rem}
.pill{font:700 1rem var(--d);letter-spacing:.04em;background:var(--paper2);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:.3rem .95rem;cursor:pointer}
.pill:hover{border-color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill:disabled{opacity:.35;cursor:default}
.wkrow{display:flex;gap:.4rem;overflow-x:auto;width:100%;padding-bottom:.4rem}.wkrow .pill{flex:none}
.seg{display:flex;gap:.4rem;margin-bottom:.8rem}
.wk{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.5rem;padding:0 1.25rem 1rem}
.wk button{text-align:left;background:var(--paper2);color:var(--ink);border:1px solid var(--line);padding:.55rem .7rem;cursor:pointer}
.wk button:hover{border-color:var(--ink)}
.wk button[aria-current="true"]{border-color:var(--goal);box-shadow:inset 0 0 0 1px var(--goal)}
.wk b{display:block;font:800 1.25rem/1.1 var(--d)}.wk small{color:var(--muted);font-size:.78rem}
.wkh{font:800 1.1rem var(--d);color:var(--muted);padding:.4rem 1.25rem 0;letter-spacing:.05em;text-transform:uppercase}
.tw{overflow-x:auto;border:1px solid var(--line);background:var(--paper);margin-bottom:1rem}
.st-t{width:100%;border-collapse:collapse;font:600 1rem var(--b);min-width:620px}
.st-t th,.st-t td{padding:.4rem .6rem;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.st-t th{font:700 .8rem var(--b);color:var(--muted)}
.st-t th:nth-child(-n+2),.st-t td:nth-child(-n+2){text-align:left}
.st-t td:nth-child(1){color:var(--muted);width:2rem}
.st-t td.t{display:flex;align-items:center;gap:.5rem;font-weight:600}
.st-t td.t .logo{width:1.5rem;height:1.5rem}
.st-t td.p{font-weight:800}
.st-t tr:last-child td{border-bottom:0}
@media (max-width:520px){.pl{grid-template-columns:3rem 40px 1fr}.pl .play{grid-column:2/-1;justify-self:start}.num{font-size:2.4rem}}
</style>
</head>
<body>
<header class="top">
  <div class="bar"><h1>SCORES <em>&amp; WHATNOT</em></h1><span id="livepill" class="lp" hidden></span>
    <nav id="tabs"><button data-tab="scores">Scores</button><button data-tab="NHL">NHL</button><button data-tab="NFL">NFL</button><button data-tab="standings">Standings</button></nav></div>
</header>
<main class="wrap" id="view"></main>
<footer class="foot" id="foot"></footer>

<dialog id="game" aria-label="Game details">
  <div class="dtop"><span id="dstamp"></span><button class="close" id="closeGame">Close</button></div>
  <div id="dhead"></div><div id="dline"></div><div id="dvids"></div><div id="dstats"></div>
  <div class="dsub">Scoring</div>
  <ul class="plays" id="dplays"></ul>
</dialog>

<dialog id="weeks" aria-label="Choose a week">
  <div class="dtop"><span>Choose a week</span><button class="close" id="closeWeeks">Close</button></div>
  <div id="wkbody"></div>
</dialog>

<script src="data.js"></script>
<script>
const NHL_API = "https://api-web.nhle.com/v1";
const ESPN = "https://site.api.espn.com/apis/site/v2/sports";
const ESPN_NFL = ESPN + "/football/nfl", ESPN_NHL = ESPN + "/hockey/nhl";
const BC = "https://players.brightcove.net/6415718365001/EXtG1xJ7H_default/index.html?autoplay=true&videoId=";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ytSearch = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
const fmtDay = x => new Date(x + "T12:00:00").toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
const RELAYS = [u => u, u => "https://corsproxy.io/?url=" + encodeURIComponent(u), u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u), u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)];
let relayIx = 0; const FEED = {nhl:"not tried", nfl:"not tried", stand:"saved copy", espnHockey:"not used"};
async function nhlGet(path){  /* the NHL feed, directly if the browser is allowed, otherwise through a public relay */
  const url = NHL_API + path; let err;
  for (let k = 0; k < RELAYS.length; k++) { const i = (relayIx + k) % RELAYS.length;
    try { const r = await getJ(RELAYS[i](url)); relayIx = i; FEED.nhl = ["direct", "relay 1", "relay 2", "relay 3"][i]; return r; } catch (e) { err = e; } }
  throw err;
}
const getJ = async u => { const r = await fetch(u); if (!r.ok) throw new Error(r.status); return r.json(); };

/* ---------- saved games (data.js, written every night by fetch_goals.py) ---------- */
let RAW = window.DAYS;
if (!RAW && Array.isArray(window.LIVE_GAMES)) RAW = {[window.LIVE_DATE || ""]: window.LIVE_GAMES};  /* older data.js format */
RAW = RAW || {};
const SAVED = [], seen = new Set();
Object.keys(RAW).sort().forEach(d => (RAW[d] || []).forEach(g => {
  const k = g.id ? g.sport + g.id : null;
  if (k && seen.has(k)) return;
  if (k) seen.add(k);
  SAVED.push(Object.assign({date: d}, g));
}));
SAVED.forEach(g => g.plays.forEach(p => { const t = p.team === "away" ? g.away : g.home; p.sport = g.sport; p.ab = t.ab || t.n; }));
const LATEST_DATE = SAVED.length ? SAVED.map(g => g.date).sort().pop() : null;
const savedDates = lg => [...new Set(SAVED.filter(g => !lg || g.sport === lg).map(g => g.date))].sort().reverse();
const nflWeeks = () => { const m = new Map(); SAVED.filter(g => g.sport === "NFL").forEach(g => { const k = g.wkn || 0; if (!m.has(k)) m.set(k, {k, label: g.wk || "Games"}); }); return [...m.values()].sort((a, b) => b.k - a.k); };

/* ---------- team records: worked out from the saved results, game by game ---------- */
const TALLY = {};
const fmtRec = (sport, t) => !t ? "" : sport === "NHL" ? `${t[0]}-${t[1]}-${t[2]}` : `${t[0]}-${t[1]}` + (t[2] ? "-" + t[2] : "");
SAVED.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : String(a.id) < String(b.id) ? -1 : 1).forEach(g => {
  const ka = g.sport + (g.away.ab || g.away.n), kh = g.sport + (g.home.ab || g.home.n);
  const regular = g.sport === "NHL" ? !g.pre : (g.wkn >= 200 && g.wkn < 300);
  if (regular) {
    const T = k => TALLY[k] || (TALLY[k] = [0, 0, 0]), A = T(ka), H = T(kh), as = +g.away.s, hs = +g.home.s;
    if (as !== hs) { const [win, lose] = as > hs ? [A, H] : [H, A]; win[0]++; if (g.sport === "NHL" && /OT|SO/.test(g.status || "")) lose[2]++; else lose[1]++; }
    else if (g.sport === "NFL") { A[2]++; H[2]++; }
  }
  g.recA = fmtRec(g.sport, TALLY[ka]); g.recH = fmtRec(g.sport, TALLY[kh]);
});

/* ---------- standings ---------- */
let STAND = window.STANDINGS && window.STANDINGS.teams && window.STANDINGS.teams.length ? window.STANDINGS : null, standLive = false;
const stTeam = t => ({ab:(t.teamAbbrev || {}).default, name:(t.teamName || {}).default, logo:t.teamLogo, logoDark:t.teamLogoDark, conf:t.conferenceName, div:t.divisionName, seq:t.divisionSequence,
  gp:t.gamesPlayed, w:t.wins, l:t.losses, otl:t.otLosses, pts:t.points, pp:t.pointPctg, row:t.regulationPlusOtWins, gf:t.goalFor, ga:t.goalAgainst, diff:t.goalDifferential,
  strk:(t.streakCode || "") + (t.streakCount || ""), l10:`${t.l10Wins || 0}-${t.l10Losses || 0}-${t.l10OtLosses || 0}`});
async function loadStandings(){
  try { const r = await nhlGet("/standings/now"); const teams = r.standings.map(stTeam);
    if (teams.length) { STAND = {date:(r.standings[0] || {}).date, teams}; standLive = true; if (tab === "standings") render(); } } catch (e) {}
}
const standRec = ab => { const t = STAND && STAND.teams.find(x => x.ab === ab); return t ? `${t.w}-${t.l}-${t.otl}` : ""; };
const nhlRec = ab => standRec(ab) || fmtRec("NHL", TALLY["NHL" + ab]);

let tab = "scores", SCORES = [], VIEW = [], nhlSkipUntil = 0;
try { const t = localStorage.getItem("sb_tab"); if (["scores", "NHL", "NFL", "standings"].includes(t)) tab = t; } catch (e) {}
const feeds = {nhl:"", nfl:""}, FLASH = {};
const S = {scores:"live", NHL:null, NFL:null, stand:"NHL", f:"", kind:"all"};
try { const t = localStorage.getItem("sb_stand"); if (t === "NHL" || t === "NFL") S.stand = t; } catch (e) {}

/* ---------- small helpers ---------- */
function logoFail(el){ const a = el.dataset.alt; if (a) { el.dataset.alt = ""; el.src = a; } else el.style.visibility = "hidden"; }
const mark = (t, cls) => { const a = t.logoDark || t.logo; return a ? `<img class="${cls || "logo"}" src="${esc(a)}" alt="" data-alt="${esc(t.logo && t.logo !== a ? t.logo : "")}" onerror="logoFail(this)">` : ""; };
const per = d => !d ? "" : d.periodType === "OT" ? "OT" : d.periodType === "SO" ? "SO" : ["", "1st", "2nd", "3rd"][d.number] || d.number + "th";
const finalOf = g => ({league:g.sport, key:g.id ? g.sport + ":" + g.id : "", state:"final", detail:(g.pre ? "Preseason · " : "") + g.status,
  away:{ab:g.away.n, logo:g.away.logo, logoDark:g.away.logoDark, s:g.away.s, rec:g.recA}, home:{ab:g.home.n, logo:g.home.logo, logoDark:g.home.logoDark, s:g.home.s, rec:g.recH}});
const fallbackScores = () => LATEST_DATE ? SAVED.filter(g => g.date === LATEST_DATE).map(finalOf) : [];

/* ---------- live scoreboard (fetched in the visitor's browser) ---------- */
const nhlT = t => ({ab:t.abbrev, logo:t.logo, logoDark:t.darkLogo || (t.logo && t.logo.replace("_light", "_dark")), s:t.score, rec:t.record || nhlRec(t.abbrev)});
const nhlS = g => { const st = {LIVE:"live", CRIT:"live", FINAL:"final", OFF:"final"}[g.gameState] || "pre", pt = (g.periodDescriptor || {}).periodType;
  return {league:"NHL", key:"NHL:" + g.id, away:nhlT(g.awayTeam), home:nhlT(g.homeTeam), state:st,
    detail: st === "live" ? per(g.periodDescriptor) + " " + ((g.clock || {}).inIntermission ? "INT" : String((g.clock || {}).timeRemaining || "").replace(/^0/, ""))
          : st === "final" ? "Final" + (pt === "OT" || pt === "SO" ? " / " + pt : "")
          : new Date(g.startTimeUTC).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})}; };
const recOf = x => { const a = x.records || x.record; if (typeof a === "string") return a; if (!Array.isArray(a)) return ""; const r = a.find(z => z.type === "total") || a[0]; return r ? r.summary || "" : ""; };

$("closeWeeks").addEventListener("click", () => $("weeks").close());
$("weeks").addEventListener("click", e => { if (e.target === $("weeks")) { $("weeks").close(); return; }
  const b = e.target.closest("[data-wk]"); if (b) { S.NFL = b.dataset.wk; $("weeks").close(); render(); window.scrollTo && window.scrollTo(0, 0); } });
$("game").addEventListener("close", () => { clearTimeout(det.timer); det.key = null; });

SCORES = fallbackScores(); render(); loadLive(); loadStandings();
setInterval(loadLive, 30000); setInterval(loadStandings, 300000);
</script>
