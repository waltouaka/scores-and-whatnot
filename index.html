<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0f;--paper:#17171a;--paper2:#202024;--ink:#ededf0;--muted:#9b9ba5;--line:#2c2c32;--bar:#000;--goal:#e4262c;--live:#ff3b30;
--d:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--b:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
html{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--b)}
button{font-family:inherit}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--goal);outline-offset:2px}
a{color:var(--ink)}
.top{background:var(--bar);border-bottom:1px solid var(--line)}
.bar{max-width:1000px;margin:0 auto;padding:.9rem 1.25rem 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:.5rem 2rem}
.bar h1{font:800 2rem/1 var(--d);margin:0 0 .6rem;letter-spacing:.01em}
#tabs{display:flex;gap:.25rem}
#tabs button{font:700 1.25rem var(--d);letter-spacing:.04em;color:var(--muted);background:none;border:0;border-bottom:4px solid transparent;padding:.4rem 1rem .5rem;cursor:pointer}
#tabs button[aria-pressed="true"]{color:#fff;border-color:var(--goal)}
.wrap{max-width:1000px;margin:0 auto;padding:1.5rem 1.25rem 4rem}
h2{font:800 1.7rem/1 var(--d);margin:1.5rem 0 .7rem}
.note{color:var(--muted)}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:1rem;margin-bottom:1rem}
.hd h2{margin:0}
select{font:600 1rem var(--b);padding:.45rem .7rem;background:var(--paper2);color:var(--ink);border:1px solid var(--line);border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.75rem}
.tile{display:block;width:100%;text-align:left;color:inherit;background:var(--paper);border:1px solid var(--line);padding:.6rem .8rem;cursor:pointer}
.tile:hover{background:var(--paper2)}
.tile.live{border-left:4px solid var(--live)}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;margin-bottom:.3rem}
.dot{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:var(--live);margin-right:.35rem;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.sd{display:flex;align-items:center;gap:.6rem;font:700 1.4rem/1.5 var(--d)}
.sd b{flex:1;font-weight:700}.sd.l{opacity:.55}
.logo{width:1.8rem;height:1.8rem;object-fit:contain;flex:none}
.game{background:var(--paper);border:1px solid var(--line);margin-bottom:1.25rem}
.sc{display:grid;grid-template-columns:1fr auto;align-items:center;gap:.1rem 1rem;padding:1rem 1.25rem .4rem}
.tm{display:flex;align-items:center;gap:.7rem;font:700 1.7rem/1.1 var(--d)}.tm .logo{width:2.4rem;height:2.4rem}
.num{font:800 2.6rem/1 var(--d);text-align:right}.lose{opacity:.55}
.st{padding:0 1.25rem;color:var(--muted);font-size:.85rem;display:flex;flex-wrap:wrap;gap:.2rem 1rem;align-items:center}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:0}
.strip{position:relative;height:24px;margin:.6rem 1.25rem 1rem;border-bottom:2px solid var(--line)}
.strip i{position:absolute;bottom:-7px;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);transform:translateX(-50%);background:var(--ink)}
.strip i.fg{background:var(--paper);width:10px;height:10px}
.plays{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.plays li{border-bottom:1px solid var(--line)}.plays li:last-child{border:0}
.pl{display:grid;grid-template-columns:3.8rem 1fr auto;gap:.75rem;align-items:center;padding:.65rem 1.25rem}
.clock{font:700 1.15rem var(--d);color:var(--muted)}.who small{display:block;color:var(--muted)}
.tag{font:700 .8rem var(--d);border:1px solid var(--line);padding:0 .35rem;margin-left:.4rem;color:var(--muted)}
.play{border:2px solid var(--ink);background:none;color:var(--ink);font:700 1rem var(--d);letter-spacing:.04em;padding:.25rem .85rem;border-radius:999px;cursor:pointer}
.play:hover{background:var(--ink);color:var(--bg)}
.clip{padding:0 1.25rem 1rem}.clip video,.clip iframe{width:100%;aspect-ratio:16/9;border:0;background:#000;display:block;margin-bottom:.4rem}
.noclip{padding:1.5rem;background:#000;color:var(--muted);margin-bottom:.4rem}
.clip a{font-size:.9rem}
.tot{display:flex;gap:2.2rem;border-bottom:2px solid var(--ink);padding-bottom:.9rem;margin-bottom:1.2rem}
.tot b{display:block;font:800 2.6rem/1 var(--d)}.tot span{color:var(--muted);font-size:.9rem}
dialog{border:1px solid var(--line);padding:0;width:min(780px,96vw);max-height:92vh;overflow:auto;background:var(--paper);color:var(--ink);box-shadow:0 24px 70px rgba(0,0,0,.7)}
dialog::backdrop{background:rgba(0,0,0,.8)}
.dtop{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1.25rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:1}
.dtop span{color:var(--muted);font-size:.85rem}
.close{border:2px solid var(--ink);background:none;color:var(--ink);font:700 1rem var(--d);padding:.2rem .8rem;border-radius:999px;cursor:pointer}
.gh{padding:1rem 1.25rem .5rem}
.gstate{color:var(--muted);margin-top:.3rem;font-size:.95rem}
.gstate.live{color:#fff}
.ls{width:100%;border-collapse:collapse;margin:.5rem 0 1rem;font:700 1.15rem var(--d)}
.ls th,.ls td{padding:.3rem 1.25rem;text-align:center;border-bottom:1px solid var(--line)}
.ls th{color:var(--muted);font-weight:700}.ls th:first-child,.ls td:first-child{text-align:left}
.ls td:last-child,.ls th:last-child{font-weight:800}
.dsub{font:800 1.3rem var(--d);padding:.4rem 1.25rem}
@media (max-width:520px){.pl{grid-template-columns:3rem 1fr}.pl .play{grid-column:2;justify-self:start}}
</style>
</head>
<body>
<header class="top">
  <div class="bar"><h1>Scoreboard</h1>
    <nav id="tabs"><button data-tab="scores">Scores</button><button data-tab="NHL">NHL</button><button data-tab="NFL">NFL</button></nav></div>
</header>
<main class="wrap" id="view"></main>

<dialog id="game" aria-label="Game details">
  <div class="dtop"><span id="dstamp"></span><button class="close" id="closeGame">Close</button></div>
  <div id="dhead"></div><div id="dline"></div>
  <div class="dsub">Scoring</div>
  <ul class="plays" id="dplays"></ul>
</dialog>

<script src="data.js"></script>
<script>
const NHL_API = "https://api-web.nhle.com/v1";
const ESPN_API = "https://site.api.espn.com/apis/site/v2/sports/football/nfl";
const BC = "https://players.brightcove.net/6415718365001/EXtG1xJ7H_default/index.html?videoId=";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ytSearch = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
const fmtDay = x => new Date(x + "T12:00:00").toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
const getJ = async u => { const r = await fetch(u); if (!r.ok) throw new Error(r.status); return r.json(); };

/* ---------- saved games (data.js, written every night by fetch_goals.py) ---------- */
let RAW = window.DAYS;
if (!RAW && Array.isArray(window.LIVE_GAMES)) RAW = {[window.LIVE_DATE || ""]: window.LIVE_GAMES};  /* older data.js format */
RAW = RAW || {};
const SAVED = [], seen = new Set();
Object.keys(RAW).sort().forEach(d => (RAW[d] || []).forEach(g => {
  const k = g.id ? g.sport + g.id : null;
  if (k && seen.has(k)) return;
  if (k) seen.add(k);
  SAVED.push(Object.assign({date: d}, g));
}));
const LATEST_DATE = SAVED.length ? SAVED.map(g => g.date).sort().pop() : null;
const savedDates = lg => [...new Set(SAVED.filter(g => !lg || g.sport === lg).map(g => g.date))].sort().reverse();
const nflWeeks = () => { const m = new Map(); SAVED.filter(g => g.sport === "NFL").forEach(g => { const k = g.wkn || 0; if (!m.has(k)) m.set(k, {k, label: g.wk || "Games"}); }); return [...m.values()].sort((a, b) => b.k - a.k); };

let tab = "scores", SCORES = [], feedOk = false, VIEW = [];
const S = {scores:"live", NHL:null, NFL:null};

/* ---------- small helpers ---------- */
function logoFail(el){ const a = el.dataset.alt; if (a) { el.dataset.alt = ""; el.src = a; } else el.style.visibility = "hidden"; }
const mark = (t, cls) => { const a = t.logoDark || t.logo; return a ? `<img class="${cls || "logo"}" src="${esc(a)}" alt="" data-alt="${esc(t.logo && t.logo !== a ? t.logo : "")}" onerror="logoFail(this)">` : ""; };
const per = d => !d ? "" : d.periodType === "OT" ? "OT" : d.periodType === "SO" ? "SO" : ["", "1st", "2nd", "3rd"][d.number] || d.number + "th";
const finalOf = g => ({league:g.sport, id:g.id, state:"final", detail:(g.pre ? "Preseason · " : "") + g.status,
  away:{ab:g.away.n, logo:g.away.logo, logoDark:g.away.logoDark, s:g.away.s}, home:{ab:g.home.n, logo:g.home.logo, logoDark:g.home.logoDark, s:g.home.s}});
const fallbackScores = () => LATEST_DATE ? SAVED.filter(g => g.date === LATEST_DATE).map(finalOf) : [];

/* ---------- live scoreboard (fetched in the visitor's browser) ---------- */
const nhlT = t => ({ab:t.abbrev, logo:t.logo, logoDark:t.darkLogo || (t.logo && t.logo.replace("_light", "_dark")), s:t.score});
const nhlS = g => { const st = {LIVE:"live", CRIT:"live", FINAL:"final", OFF:"final"}[g.gameState] || "pre", pt = (g.periodDescriptor || {}).periodType;
  return {league:"NHL", id:String(g.id), away:nhlT(g.awayTeam), home:nhlT(g.homeTeam), state:st,
    detail: st === "live" ? per(g.periodDescriptor) + " " + ((g.clock || {}).inIntermission ? "INT" : (g.clock || {}).timeRemaining || "")
          : st === "final" ? "Final" + (pt === "OT" || pt === "SO" ? " / " + pt : "")
          : new Date(g.startTimeUTC).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})}; };
const nflS = ev => { const c = ev.competitions[0].competitors, t = ev.status.type;
  const f = h => { const x = c.find(z => z.homeAway === h), l = x.team.logo; return {ab:x.team.abbreviation, logo:l, logoDark:l && l.replace("/500/", "/500-dark/"), s:x.score}; };
  return {league:"NFL", id:String(ev.id), away:f("away"), home:f("home"), state:{in:"live", post:"final"}[t.state] || "pre", detail:t.shortDetail}; };
async function loadLive(){
  const [a, b] = await Promise.allSettled([getJ(NHL_API + "/score/now"), getJ(ESPN_API + "/scoreboard")]);
  const out = [];
  try { if (a.status === "fulfilled") out.push(...a.value.games.map(nhlS)); } catch (e) {}
  try { if (b.status === "fulfilled") out.push(...b.value.events.map(nflS)); } catch (e) {}
  feedOk = a.status === "fulfilled" || b.status === "fulfilled";
  const next = out.length ? out : fallbackScores();
  if (JSON.stringify(next) !== JSON.stringify(SCORES)) { SCORES = next; if (tab === "scores" && S.scores === "live") render(); }
}

/* ---------- Scores tab ---------- */
const sd = (t, g, other) => { const lose = g.state === "final" && +t.s < +other.s;
  return `<div class="sd ${lose ? "l" : ""}">${mark(t)}<b>${esc(t.ab)}</b><span>${g.state === "pre" ? "" : esc(t.s == null ? "" : t.s)}</span></div>`; };
const tile = g => { const inner = `<div class="meta"><span>${g.league}</span><span>${g.state === "live" ? '<i class="dot"></i>' : ""}${esc(g.detail)}</span></div>${sd(g.away, g, g.home)}${sd(g.home, g, g.away)}`;
  return g.id ? `<button type="button" class="tile ${g.state}" data-open="${g.league}:${esc(g.id)}">${inner}</button>` : `<div class="tile ${g.state}">${inner}</div>`; };
const noData = `<p class="note">No saved games yet. In GitHub, open <b>Actions</b>, choose <b>Update goals nightly</b> and click <b>Run workflow</b> to load the season.</p>`;
function scoresView(){
  const days = savedDates();
  const sel = `<select id="ssel" aria-label="Choose a day"><option value="live">Today &amp; live</option>${days.map(x => `<option value="${x}"${x === S.scores ? " selected" : ""}>${fmtDay(x)}</option>`).join("")}</select>`;
  let body;
  if (S.scores === "live") {
    body = [["Live now", "live"], ["Final", "final"], ["Upcoming", "pre"]].map(([t, s]) => { const l = SCORES.filter(g => g.state === s);
      return l.length ? `<h2>${t}</h2><div class="grid">${l.map(tile).join("")}</div>` : ""; }).join("");
  } else {
    const l = SAVED.filter(g => g.date === S.scores);
    body = ["NHL", "NFL"].map(lg => { const x = l.filter(g => g.sport === lg).map(finalOf);
      return x.length ? `<h2>${lg}</h2><div class="grid">${x.map(tile).join("")}</div>` : ""; }).join("");
  }
  const warn = S.scores === "live" && !feedOk ? `<p class="note">The live feed isn't reachable right now, so this shows the last saved results.</p>` : "";
  return `<div class="hd"><h2>Scores</h2>${sel}</div><p class="note" style="margin-top:-.4rem">Click any game for the live game page.</p>${warn}` + (body || (SAVED.length ? `<p class="note">No games found.</p>` : noData));
}

/* ---------- NHL / NFL tabs (saved results with embedded clips) ---------- */
function leagueView(lg){
  let games, nav;
  if (lg === "NHL") {
    const ds = savedDates("NHL"); if (!ds.length) return noData;
    const d = ds.includes(S.NHL) ? S.NHL : ds[0];
    games = SAVED.filter(g => g.sport === "NHL" && g.date === d);
    nav = `<select id="lsel" aria-label="Choose a night">${ds.map(x => `<option value="${x}"${x === d ? " selected" : ""}>${fmtDay(x)}</option>`).join("")}</select>`;
  } else {
    const ws = nflWeeks(); if (!ws.length) return noData;
    const k = ws.some(w => String(w.k) === String(S.NFL)) ? String(S.NFL) : String(ws[0].k);
    games = SAVED.filter(g => g.sport === "NFL" && String(g.wkn || 0) === k).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    nav = `<select id="lsel" aria-label="Choose a week">${ws.map(w => `<option value="${w.k}"${String(w.k) === k ? " selected" : ""}>${esc(w.label)}</option>`).join("")}</select>`;
  }
  VIEW = games;
  const plays = games.flatMap(g => g.plays), fg = plays.filter(p => p.kind === "fg").length, main = plays.length - fg;
  const tot = `<div class="tot"><div><b>${games.length}</b><span>games</span></div><div><b>${main}</b><span>${lg === "NHL" ? "goals" : "touchdowns"}</span></div>${lg === "NFL" ? `<div><b>${fg}</b><span>field goals</span></div>` : ""}</div>`;
  return `<div class="hd"><h2>${lg} results</h2>${nav}</div>${tot}` + games.map((g, gi) => {
    const aw = +g.away.s > +g.home.s, total = Math.max(60, ...g.plays.map(p => p.t + 1));
    const dots = g.plays.map(p => `<i class="${p.kind === "fg" ? "fg" : ""}" style="left:${(p.t / total * 100).toFixed(1)}%" title="${esc(p.clock + " " + p.who)}"></i>`).join("");
    const rows = g.plays.map((p, pi) => playRow(p, (p.team === "away" ? g.away : g.home).n, `data-g="${gi}" data-p="${pi}"`)).join("");
    return `<article class="game"><div class="sc"><div class="tm ${aw ? "" : "lose"}">${mark(g.away, "logo")}${esc(g.away.n)}</div><div class="num ${aw ? "" : "lose"}">${g.away.s}</div>
      <div class="tm ${aw ? "lose" : ""}">${mark(g.home, "logo")}${esc(g.home.n)}</div><div class="num ${aw ? "lose" : ""}">${g.home.s}</div></div>
      <div class="st"><span>${lg === "NFL" ? fmtDay(g.date) + " · " : ""}${g.pre ? "Preseason · " : ""}${esc(g.status)}</span>${g.id ? `<button class="link" data-open="${g.sport}:${esc(g.id)}">Open game page</button>` : ""}</div>
      <div class="strip" aria-hidden="true">${dots}</div><ul class="plays">${rows}</ul></article>`; }).join("");
}
const playRow = (p, teamName, attrs) => `<li><div class="pl"><span class="clock">${esc(p.clock)}</span>
  <span class="who"><b>${esc(p.who)}</b> · ${esc(teamName)}${p.kind === "fg" ? '<span class="tag">FG</span>' : ""}<small>${esc(p.type)} – ${esc(p.assist)}</small></span>
  <button class="play" ${attrs}>▶ Watch</button></div><div class="clip" hidden></div></li>`;
const embed = p => { const e = p.embed;
  const m = !e ? `<div class="noclip">No embeddable clip for this play yet.</div>`
    : e.kind === "video" ? `<video src="${esc(e.src)}" controls autoplay playsinline></video>`
    : `<iframe src="${esc(e.src)}" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
  return m + (p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${p.exact ? "Open the clip in a new tab" : "Search for the clip"}</a>` : ""); };
function toggleClip(btn, play, scope){
  const box = btn.closest("li").querySelector(".clip"), was = !box.hidden;
  scope.querySelectorAll(".clip").forEach(c => { c.hidden = true; c.innerHTML = ""; });
  if (was) return false;
  box.innerHTML = embed(play); box.hidden = false; return true;
}

/* ---------- live game page ---------- */
const goalType = (d, e, homeId) => { if (d.goalModifier === "empty-net") return "Empty-net goal"; if (d.goalModifier === "penalty-shot") return "Penalty-shot goal";
  const c = String(e.situationCode || ""); if (c.length >= 3) { const a = +c[1], h = +c[2], own = d.eventOwnerTeamId === homeId ? h : a, opp = d.eventOwnerTeamId === homeId ? a : h;
    if (own > opp) return "Power-play goal"; if (own < opp) return "Short-handed goal"; } return "Goal"; };
async function detNHL(id){
  const p = await getJ(`${NHL_API}/gamecenter/${id}/play-by-play`);
  const nm = {}; (p.rosterSpots || []).forEach(r => nm[r.playerId] = ((r.firstName || {}).default || "").slice(0, 1) + ". " + ((r.lastName || {}).default || ""));
  const A = p.awayTeam, H = p.homeTeam, st = {LIVE:"live", CRIT:"live", FINAL:"final", OFF:"final"}[p.gameState] || "pre";
  const lastT = (p.gameOutcome || {}).lastPeriodType || (p.periodDescriptor || {}).periodType, ck = p.clock || {};
  const detail = st === "live" ? per(p.periodDescriptor) + " " + (ck.inIntermission ? "intermission" : String(ck.timeRemaining || "").replace(/^0/, ""))
    : st === "final" ? "Final" + (lastT === "OT" || lastT === "SO" ? " / " + lastT : "")
    : "Starts " + new Date(p.startTimeUTC).toLocaleString([], {weekday:"short", hour:"numeric", minute:"2-digit"});
  const plays = (p.plays || []).filter(e => e.typeDescKey === "goal" && (e.periodDescriptor || {}).periodType !== "SO").map(e => {
    const d = e.details || {}, pd = e.periodDescriptor || {}, n = pd.number || 1;
    const as = [d.assist1PlayerId, d.assist2PlayerId].filter(Boolean).map(i => nm[i]).filter(Boolean);
    return {clock: (pd.periodType === "OT" ? "OT" : per(pd)) + " " + String(e.timeInPeriod || "0:00").replace(/^0/, ""), per:n, team: d.eventOwnerTeamId === H.id ? "home" : "away",
      who: nm[d.scoringPlayerId] || "Own goal", assist: as.join(", ") || "unassisted", type: goalType(d, e, H.id), kind:"goal",
      embed: d.highlightClip ? {kind:"iframe", src: BC + d.highlightClip} : null,
      url: d.highlightClipSharingUrl || ytSearch(`${nm[d.scoringPlayerId] || ""} goal ${(A.abbrev || "")} ${(H.abbrev || "")}`), exact: !!d.highlightClipSharingUrl}; });
  const cols = Math.max(3, ...plays.map(x => x.per)), lab = i => i < 3 ? String(i + 1) : "OT", line = {cols: [], away: [], home: []};
  for (let i = 0; i < cols; i++) { line.cols.push(lab(i)); line.away.push(plays.filter(x => x.per - 1 === i && x.team === "away").length); line.home.push(plays.filter(x => x.per - 1 === i && x.team === "home").length); }
  const tm = t => ({ab:t.abbrev, name:((t.placeName || {}).default || "") + " " + ((t.commonName || {}).default || ""), logo:t.logo, logoDark:t.darkLogo || (t.logo && t.logo.replace("_light", "_dark")), s:t.score, sog:t.sog});
  return {league:"NHL", state:st, detail, away:tm(A), home:tm(H), plays, line: st === "pre" ? null : line, extra: (A.sog != null && st !== "pre") ? `Shots on goal ${A.sog} – ${H.sog}` : ""};
}
const splitTd = (text, fb) => { const m = String(text || "").trim().match(/^(.*?)\s+(\d+)\s+Yd\s+(.*)$/i); if (!m) return [String(text || "").trim() || fb, fb];
  const rest = m[3].replace(/\s*\(.*?\)\s*$/, "").trim(); return [m[1], `${m[2]}-yd ${rest.charAt(0).toLowerCase() + rest.slice(1)}`]; };
function nflVideo(videos, who, used){ const last = (who.split(" ").pop() || "").toLowerCase(); if (last.length < 3) return [null, null];
  for (let i = 0; i < videos.length; i++) { if (used.has(i)) continue; const v = videos[i], blob = ((v.headline || "") + " " + (v.description || "")).toLowerCase();
    if (blob.includes(last) && ["touchdown", " td", "scores", "end zone", "field goal", " fg", "kicks"].some(k => blob.includes(k))) {
      const l = v.links || {}, s = l.source || {}, href = ((l.web || {}).href) || null;
      let mp4 = ((s.HD || s.full || ((l.mobile || {}).source) || {}).href) || null; if (mp4 && !/\.mp4/i.test(mp4)) mp4 = null;
      if (href || mp4) { used.add(i); return [href, mp4]; } } }
  return [null, null]; }
async function detNFL(id){
  const s = await getJ(`${ESPN_API}/summary?event=${id}`), comp = s.header.competitions[0], t = comp.status.type, cs = comp.competitors, home = cs.find(c => c.homeAway === "home"), away = cs.find(c => c.homeAway === "away");
  const tm = c => { const l = c.team.logo || ((c.team.logos || [])[0] || {}).href; return {ab:c.team.abbreviation, name:c.team.displayName, logo:l, logoDark:l && l.replace("/500/", "/500-dark/"), s:c.score, id:String(c.team.id)}; };
  const st = {in:"live", post:"final"}[t.state] || "pre", used = new Set(), videos = s.videos || [];
  const plays = (s.scoringPlays || []).map(sp => {
    const tt = (sp.type || {}).text || "", low = tt.toLowerCase(), td = low.includes("touchdown"), fg = low.includes("field goal"), p = (sp.period || {}).number || 1;
    const [who, as] = splitTd(sp.text, tt), [href, mp4] = nflVideo(videos, who, used);
    return {clock: (p <= 4 ? "Q" + p : "OT") + " " + (((sp.clock || {}).displayValue) || "0:00"), per:p, team: String((sp.team || {}).id) === String(home.team.id) ? "home" : "away",
      who, assist: fg ? as.replace("field Goal", "field goal") : as, type: fg ? "Field goal" : td ? tt.replace(" Touchdown", " TD") : tt, kind: fg ? "fg" : td ? "td" : "other",
      embed: mp4 ? {kind:"video", src:mp4} : null, url: href || ytSearch(`${who} ${fg ? "field goal" : "touchdown"} ${away.team.abbreviation} ${home.team.abbreviation} NFL highlights`), exact: !!href}; });
  const ls = c => (c.linescores || []).map(x => x.displayValue != null ? x.displayValue : x.value);
  const la = ls(away), lh = ls(home), cols = Math.max(la.length, lh.length);
  const line = cols && st !== "pre" ? {cols: Array.from({length: cols}, (_, i) => i < 4 ? "Q" + (i + 1) : "OT"), away: la, home: lh} : null;
  return {league:"NFL", state:st, detail:t.shortDetail || t.detail || "", away:tm(away), home:tm(home), plays, line, extra:""};
}
const savedDetail = (lg, id) => { const g = SAVED.find(x => x.sport === lg && String(x.id) === String(id)); if (!g) return null;
  return {league:lg, state:"final", detail:(g.pre ? "Preseason · " : "") + g.status, away:{ab:g.away.n, name:g.away.n, logo:g.away.logo, logoDark:g.away.logoDark, s:g.away.s},
    home:{ab:g.home.n, name:g.home.n, logo:g.home.logo, logoDark:g.home.logoDark, s:g.home.s}, plays:g.plays, line:null, extra:"", offline:true}; };

const det = {key:null, timer:null, data:null, sig:"", open:null};
async function openGame(lg, id){
  det.key = lg + ":" + id; det.data = null; det.sig = ""; det.open = null;
  $("dhead").innerHTML = `<p class="note" style="padding:1rem 1.25rem">Loading game…</p>`; $("dline").innerHTML = ""; $("dplays").innerHTML = ""; $("dstamp").textContent = "";
  $("game").showModal(); await pollGame();
}
async function pollGame(){
  clearTimeout(det.timer);
  const key = det.key; if (!key) return;
  const [lg, id] = key.split(":");
  try { const d = await (lg === "NHL" ? detNHL(id) : detNFL(id)); if (det.key !== key) return; det.data = d; paintGame(); }
  catch (e) { if (det.key !== key) return; if (!det.data) { det.data = savedDetail(lg, id); if (det.data) paintGame(); else $("dhead").innerHTML = `<p class="note" style="padding:1rem 1.25rem">This game can't be loaded right now.</p>`; } }
  const st = det.data && det.data.state;  /* finished games are loaded once; live games refresh every 15s */
  if (det.key === key && (st === "live" || st === "pre")) det.timer = setTimeout(pollGame, st === "live" ? 15000 : 60000);
}
function paintGame(){
  const d = det.data, tm = (t, other) => { const lose = d.state === "final" && +t.s < +other.s;
    return `<div class="tm ${lose ? "lose" : ""}">${mark(t)}${esc(t.name || t.ab)}</div><div class="num ${lose ? "lose" : ""}">${d.state === "pre" ? "" : esc(t.s == null ? "" : t.s)}</div>`; };
  $("dhead").innerHTML = `<div class="gh"><div class="sc" style="padding:0">${tm(d.away, d.home)}${tm(d.home, d.away)}</div>
    <div class="gstate ${d.state}">${d.state === "live" ? '<i class="dot"></i>' : ""}${esc(d.detail)}${d.extra ? " · " + esc(d.extra) : ""}</div>${d.offline ? `<div class="gstate">Live feed unavailable, showing saved results.</div>` : ""}</div>`;
  $("dline").innerHTML = d.line ? `<table class="ls"><thead><tr><th></th>${d.line.cols.map(c => `<th>${esc(c)}</th>`).join("")}<th>T</th></tr></thead><tbody>
    <tr><td>${esc(d.away.ab)}</td>${d.line.away.map(v => `<td>${esc(v)}</td>`).join("")}<td>${esc(d.away.s)}</td></tr>
    <tr><td>${esc(d.home.ab)}</td>${d.line.home.map(v => `<td>${esc(v)}</td>`).join("")}<td>${esc(d.home.s)}</td></tr></tbody></table>` : "";
  const sig = d.plays.map(p => p.clock + p.who + p.type + (p.embed ? 1 : 0)).join("|");
  if (sig !== det.sig) {  /* only rebuild the list when something scored, so an open clip keeps playing */
    det.sig = sig;
    $("dplays").innerHTML = d.plays.length ? d.plays.map((p, i) => playRow(p, (p.team === "away" ? d.away : d.home).name || (p.team === "away" ? d.away : d.home).ab, `data-dp="${i}"`)).join("")
      : `<li><div class="pl" style="display:block"><span class="note">${d.state === "pre" ? "No scoring yet." : "No scoring plays yet."}</span></div></li>`;
    if (det.open != null && d.plays[det.open]) { const b = $("dplays").querySelector(`[data-dp="${det.open}"]`); if (b) toggleClip(b, d.plays[det.open], $("dplays")); }
  }
  $("dstamp").textContent = d.state === "live" ? "Updating every 15 seconds · " + new Date().toLocaleTimeString() : d.offline ? "" : "Updated " + new Date().toLocaleTimeString();
}
function closeGame(){ clearTimeout(det.timer); det.key = null; det.data = null; $("dplays").innerHTML = ""; if ($("game").open) $("game").close(); }

/* ---------- wiring ---------- */
function render(){
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.tab === tab));
  $("view").innerHTML = tab === "scores" ? scoresView() : leagueView(tab);
}
document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => { tab = b.dataset.tab; render(); }));
$("view").addEventListener("change", e => {
  if (e.target.id === "ssel") S.scores = e.target.value; else if (e.target.id === "lsel") S[tab] = e.target.value; else return;
  render();
});
$("view").addEventListener("click", e => {
  const o = e.target.closest("[data-open]"); if (o) { const i = o.dataset.open.indexOf(":"); openGame(o.dataset.open.slice(0, i), o.dataset.open.slice(i + 1)); return; }
  const b = e.target.closest(".play"); if (b && b.dataset.g != null) toggleClip(b, VIEW[+b.dataset.g].plays[+b.dataset.p], $("view"));
});
$("game").addEventListener("click", e => {
  if (e.target === $("game")) { closeGame(); return; }
  const b = e.target.closest(".play"); if (b && b.dataset.dp != null && det.data) { const i = +b.dataset.dp; det.open = toggleClip(b, det.data.plays[i], $("dplays")) ? i : null; }
});
$("closeGame").addEventListener("click", closeGame);
$("game").addEventListener("close", () => { clearTimeout(det.timer); det.key = null; });

SCORES = fallbackScores(); render(); loadLive(); setInterval(loadLive, 30000);
</script>
