<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ice:#E9EEF3;--paper:#fff;--ink:#0E1B2C;--muted:#5B6B7C;--line:#CBD5DE;--bar:#0A1626;--goal:#E4262C;--live:#E4262C;
--d:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--b:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--ice:#0B1420;--paper:#121E2D;--ink:#E8EEF3;--muted:#94A4B4;--line:#25364A}}
*{box-sizing:border-box}body{margin:0;background:var(--ice);color:var(--ink);font:400 16px/1.5 var(--b)}
button:focus-visible,a:focus-visible{outline:3px solid var(--goal);outline-offset:2px}
.top{background:var(--bar);color:#fff}
.bar{max-width:1000px;margin:0 auto;padding:.9rem 1.25rem 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:.5rem 2rem}
.bar h1{font:800 2rem/1 var(--d);margin:0 0 .6rem;letter-spacing:.01em}
#tabs{display:flex;gap:.25rem}
#tabs button{font:700 1.25rem var(--d);letter-spacing:.04em;color:#9FB0C2;background:none;border:0;border-bottom:4px solid transparent;padding:.4rem 1rem .5rem;cursor:pointer}
#tabs button[aria-pressed="true"]{color:#fff;border-color:var(--goal)}
.tk small{grid-column:1/3;font:500 .75rem var(--b);color:#9FB0C2}
.wrap{max-width:1000px;margin:0 auto;padding:1.5rem 1.25rem 4rem}
h2{font:800 1.7rem/1 var(--d);margin:1.5rem 0 .7rem}
.note{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.75rem}
.tile{background:var(--paper);border:1px solid var(--line);padding:.6rem .8rem}
.tile.live{border-left:4px solid var(--live)}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;margin-bottom:.3rem}
.dot{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:var(--live);margin-right:.35rem;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.sd{display:flex;align-items:center;gap:.6rem;font:700 1.4rem/1.5 var(--d)}
.sd b{flex:1;font-weight:700}.sd.l{opacity:.55}
.logo{width:1.8rem;height:1.8rem;object-fit:contain;flex:none}
.game{background:var(--paper);border:1px solid var(--line);margin-bottom:1.25rem}
.sc{display:grid;grid-template-columns:1fr auto;align-items:center;gap:.1rem 1rem;padding:1rem 1.25rem .4rem}
.tm{display:flex;align-items:center;gap:.7rem;font:700 1.7rem/1.1 var(--d)}.tm .logo{width:2.4rem;height:2.4rem}
.num{font:800 2.6rem/1 var(--d);text-align:right}.lose{opacity:.55}
.st{padding:0 1.25rem;color:var(--muted);font-size:.85rem}
.strip{position:relative;height:24px;margin:.6rem 1.25rem 1rem;border-bottom:2px solid var(--line)}
.strip i{position:absolute;bottom:-7px;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);transform:translateX(-50%);background:var(--ink)}
.strip i.fg{background:var(--paper);width:10px;height:10px}
.plays{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.plays li{border-bottom:1px solid var(--line)}.plays li:last-child{border:0}
.pl{display:grid;grid-template-columns:3.8rem 1fr auto;gap:.75rem;align-items:center;padding:.65rem 1.25rem}
.clock{font:700 1.15rem var(--d);color:var(--muted)}.who small{display:block;color:var(--muted)}
.tag{font:700 .8rem var(--d);border:1px solid var(--line);padding:0 .35rem;margin-left:.4rem;color:var(--muted)}
.play{border:2px solid var(--ink);background:none;color:var(--ink);font:700 1rem var(--d);letter-spacing:.04em;padding:.25rem .85rem;border-radius:999px;cursor:pointer}
.play:hover{background:var(--ink);color:var(--paper)}
.clip{padding:0 1.25rem 1rem}.clip video,.clip iframe{width:100%;aspect-ratio:16/9;border:0;background:#05090F;display:block;margin-bottom:.4rem}
.noclip{padding:1.5rem;background:#05090F;color:#9FB0C2;margin-bottom:.4rem}
.clip a{color:var(--ink);font-size:.9rem}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:1rem;margin-bottom:1rem}
.hd select{font:600 1rem var(--b);padding:.4rem .6rem;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px}
.tot{display:flex;gap:2.2rem;border-bottom:2px solid var(--ink);padding-bottom:.9rem;margin-bottom:1.2rem}
.tot b{display:block;font:800 2.6rem/1 var(--d)}.tot span{color:var(--muted);font-size:.9rem}
@media (max-width:520px){.pl{grid-template-columns:3rem 1fr}.pl .play{grid-column:2;justify-self:start}}
</style>
</head>
<body>
<header class="top">
  <div class="bar"><h1>Scoreboard</h1>
    <nav id="tabs"><button data-tab="scores">Scores</button><button data-tab="NHL">NHL</button><button data-tab="NFL">NFL</button></nav></div>
</header>
<main class="wrap" id="view"></main>
<script src="data.js"></script>
<script>
const DAYS = window.DAYS || {};
const LATEST = DAYS[Object.keys(DAYS).sort().pop()] || [];
let GAMES = LATEST, SCORES = [], feedOk = false, tab = "scores";
const SEL = {};
const fmt = x => new Date(x + "T12:00:00").toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
const datesFor = lg => Object.keys(DAYS).filter(d => DAYS[d].some(g => g.sport === lg)).sort().reverse();
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mark = t => t.logo ? `<picture>${t.logoDark ? `<source media="(prefers-color-scheme: dark)" srcset="${esc(t.logoDark)}">` : ""}<img class="logo" src="${esc(t.logo)}" alt="" onerror="this.style.visibility='hidden'"></picture>` : "";

/* ---- live scores, fetched straight from the NHL and ESPN in the visitor's browser ---- */
const per = d => !d ? "" : d.periodType === "OT" ? "OT" : d.periodType === "SO" ? "SO" : ["","1st","2nd","3rd"][d.number] || d.number + "th";
const nhlT = t => ({ab:t.abbrev, logo:t.logo, logoDark:t.darkLogo, s:t.score});
const nhlS = g => { const st = {LIVE:"live",CRIT:"live",FINAL:"final",OFF:"final"}[g.gameState] || "pre", pt = (g.periodDescriptor||{}).periodType;
  return {league:"NHL", away:nhlT(g.awayTeam), home:nhlT(g.homeTeam), state:st,
    detail: st==="live" ? per(g.periodDescriptor)+" "+((g.clock||{}).inIntermission ? "INT" : (g.clock||{}).timeRemaining||"")
          : st==="final" ? "Final"+(pt==="OT"||pt==="SO" ? " / "+pt : "")
          : new Date(g.startTimeUTC).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})}; };
const nflS = ev => { const c = ev.competitions[0].competitors, t = ev.status.type;
  const f = h => { const x = c.find(z => z.homeAway === h), l = x.team.logo; return {ab:x.team.abbreviation, logo:l, logoDark:l && l.replace("/500/","/500-dark/"), s:x.score}; };
  return {league:"NFL", away:f("away"), home:f("home"), state:{in:"live",post:"final"}[t.state] || "pre", detail:t.shortDetail}; };
const finalOf = g => ({league:g.sport, state:"final", detail:g.status,
  away:{ab:g.away.n, logo:g.away.logo, logoDark:g.away.logoDark, s:g.away.s}, home:{ab:g.home.n, logo:g.home.logo, logoDark:g.home.logoDark, s:g.home.s}});
const getJ = async u => { const r = await fetch(u); if (!r.ok) throw 0; return r.json(); };
async function loadLive(){
  const [a, b] = await Promise.allSettled([getJ("https://api-web.nhle.com/v1/score/now"), getJ("https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard")]);
  const out = [];
  try { if (a.status === "fulfilled") out.push(...a.value.games.map(nhlS)); } catch(e){}
  try { if (b.status === "fulfilled") out.push(...b.value.events.map(nflS)); } catch(e){}
  feedOk = a.status === "fulfilled" || b.status === "fulfilled";
  SCORES = out.length ? out : LATEST.map(finalOf);
  if (tab === "scores") render();
}

/* ---- views ---- */
const sd = (t, g, other) => { const lose = g.state === "final" && +t.s < +other.s;
  return `<div class="sd ${lose ? "l" : ""}">${mark(t)}<b>${esc(t.ab)}</b><span>${g.state === "pre" ? "" : esc(t.s ?? "")}</span></div>`; };
const tile = g => `<div class="tile ${g.state}"><div class="meta"><span>${g.league}</span><span>${g.state === "live" ? '<i class="dot"></i>' : ""}${esc(g.detail)}</span></div>${sd(g.away, g, g.home)}${sd(g.home, g, g.away)}</div>`;
function scoresView(){
  const body = [["Live now","live"],["Final","final"],["Upcoming","pre"]].map(([t, s]) => { const l = SCORES.filter(g => g.state === s);
    return l.length ? `<h2>${t}</h2><div class="grid">${l.map(tile).join("")}</div>` : ""; }).join("");
  return (feedOk ? "" : `<p class="note">The live feed isn't reachable right now, so this shows the last saved results.</p>`) + (body || `<p class="note">No games found.</p>`);
}
function leagueView(lg){
  const ds = datesFor(lg), d = ds.includes(SEL[lg]) ? SEL[lg] : ds[0];
  if (!d) return `<p class="note">No ${lg} games saved yet.</p>`;
  GAMES = DAYS[d];
  const games = GAMES.filter(g => g.sport === lg), plays = games.flatMap(g => g.plays);
  const nav = `<select id="dsel" aria-label="Choose a night">${ds.map(x => `<option value="${x}" ${x === d ? "selected" : ""}>${fmt(x)}</option>`).join("")}</select>`;
  const fg = plays.filter(p => p.kind === "fg").length, main = plays.length - fg;
  const tot = `<div class="tot"><div><b>${games.length}</b><span>games</span></div><div><b>${main}</b><span>${lg === "NHL" ? "goals" : "touchdowns"}</span></div>${lg === "NFL" ? `<div><b>${fg}</b><span>field goals</span></div>` : ""}</div>`;
  return `<div class="hd"><h2 style="margin:0">${lg} results</h2>${nav}</div>${tot}` + games.map(g => {
    const aw = +g.away.s > +g.home.s, gi = GAMES.indexOf(g), total = Math.max(60, ...g.plays.map(p => p.t + 1));
    const dots = g.plays.map(p => `<i class="${p.kind === "fg" ? "fg" : ""}" style="left:${(p.t / total * 100).toFixed(1)}%" title="${esc(p.clock + " " + p.who)}"></i>`).join("");
    const rows = g.plays.map((p, pi) => `<li><div class="pl"><span class="clock">${esc(p.clock)}</span>
      <span class="who"><b>${esc(p.who)}</b> · ${esc((p.team === "away" ? g.away : g.home).n)}${p.kind === "fg" ? '<span class="tag">FG</span>' : ""}<small>${esc(p.type)} – ${esc(p.assist)}</small></span>
      <button class="play" data-g="${gi}" data-p="${pi}">▶ Watch</button></div><div class="clip" hidden></div></li>`).join("");
    return `<article class="game"><div class="sc"><div class="tm ${aw ? "" : "lose"}">${mark(g.away)}${esc(g.away.n)}</div><div class="num ${aw ? "" : "lose"}">${g.away.s}</div>
      <div class="tm ${aw ? "lose" : ""}">${mark(g.home)}${esc(g.home.n)}</div><div class="num ${aw ? "lose" : ""}">${g.home.s}</div></div>
      <div class="st">${esc(g.status)}</div><div class="strip" aria-hidden="true">${dots}</div><ul class="plays">${rows}</ul></article>`; }).join("");
}
function render(){
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.tab === tab));
  $("view").innerHTML = tab === "scores" ? scoresView() : leagueView(tab);
}
const embed = p => { const e = p.embed;
  const m = !e ? `<div class="noclip">No embeddable clip for this play yet.</div>`
    : e.kind === "video" ? `<video src="${esc(e.src)}" controls autoplay playsinline></video>`
    : `<iframe src="${esc(e.src)}" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
  return m + `<a href="${esc(p.url)}" target="_blank" rel="noopener">${p.exact ? "Open the clip in a new tab" : "Search for the clip"}</a>`; };

$("view").addEventListener("change", e => { if (e.target.id === "dsel") { SEL[tab] = e.target.value; render(); } });
document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => { tab = b.dataset.tab; render(); }));
$("view").addEventListener("click", e => {
  const b = e.target.closest(".play"); if (!b) return;
  const box = b.closest("li").querySelector(".clip"), wasOpen = !box.hidden;
  document.querySelectorAll(".clip").forEach(c => { c.hidden = true; c.innerHTML = ""; });
  if (wasOpen) return;
  box.innerHTML = embed(GAMES[+b.dataset.g].plays[+b.dataset.p]); box.hidden = false;
});
SCORES = LATEST.map(finalOf); render(); loadLive(); setInterval(loadLive, 30000);
</script>
</body>
</html>
