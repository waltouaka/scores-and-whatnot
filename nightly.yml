name: Update goals nightly
on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC, about 6am Eastern
  workflow_dispatch:        # lets you run it by hand from GitHub
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_goals.py
      - run: |
          git config user.name "goal-bot"
          git config user.email "goal-bot@users.noreply.github.com"
          git add data.js
          git commit -m "Update goals" || echo "No changes"
          git push
